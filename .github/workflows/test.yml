name: Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master


env:
  MIN_COVERED_MSI: 100
  MIN_MSI: 100
  PHP_EXTENSIONS: "mbstring, pgsql"
  PHP_TOOLS: composer,  composer-require-checker, composer-normalize, composer-unused
  key: cache-v1

jobs:
  ci:
    runs-on: 'ubuntu-latest'
    strategy:
      matrix:
        php_version:
          - "8.1"
        redis-version:
          - "5"
        dependencies:
          - "locked"

    name: PHP ${{ matrix.php_version }} - 'ubuntu-latest' - 'prefer-stable'

    steps:
    - name: Checkout
      uses: actions/checkout@v2
      with:
       fetch-depth: 2

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php_version }}
        tools: composer:v2
        coverage: none

    - name: Composer install
      run: composer install

    - run: 'echo "$SII_CERTIFICATE" > storage/clave.base64'
      shell: bash
      env:
        SII_CERTIFICATE: ${{secrets.SII_CERTIFICATE}}

    - name: Run Tests
      run: APP_ENV=testing vendor/bin/pest